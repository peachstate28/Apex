let selectedExercise='';
function analytics(logs){const data=new Map();for(const l of logs)for(const [n,ss] of Object.entries(l.sets))for(const v of Object.values(ss)){if(!v.done||!(Number(v.weight)>0)||!(Number(v.reps)>0))continue;if(!data.has(n))data.set(n,new Map());const dates=data.get(n);const a=dates.get(l.date)||{w:0,volume:0};a.w=Math.max(a.w,Number(v.weight));a.volume+=Number(v.weight)*Number(v.reps);dates.set(l.date,a)}const names=[...data.keys()].sort();if(!names.length)return '<article><h3>Strength analytics</h3><p>Log weighted sets to see trends.</p></article>';if(!data.has(selectedExercise))selectedExercise=names[0];const pts=[...data.get(selectedExercise)].sort((a,b)=>a[0].localeCompare(b[0]));const max=Math.max(...pts.map(p=>p[1].w),1);const coords=pts.map((p,i)=>[30+(pts.length===1?135:i*270/(pts.length-1)),135-p[1].w/max*105]);return `<article><h3>Strength analytics</h3><label>Exercise <select style="max-width:100%" onchange="selectedExercise=this.value;render()">${names.map(n=>`<option ${n===selectedExercise?'selected':''}>${esc(n)}</option>`).join('')}</select></label><p>Heaviest completed set per day (lb)</p><svg class="chart" viewBox="0 0 330 160" role="img" aria-label="Weight trend"><path d="M30 15V135H310" fill="none" stroke="#798579"/><text x="2" y="25" fill="#aab2aa" font-size="11">${max}</text><text x="12" y="135" fill="#aab2aa" font-size="11">0</text><polyline points="${coords.map(c=>c.join(',')).join(' ')}" fill="none" style="stroke:var(--accent)" stroke-width="3"/>${coords.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="4" style="fill:var(--accent)"/>`).join('')}</svg>${pts.map(([d,a])=>`<p class="muted">${d} · ${a.w} lb best · ${a.volume.toLocaleString()} lb-reps logged</p>`).join('')}<small>Volume uses entered loads, not estimated total dumbbell load.</small></article>`}


const muscles={
'Flat Dumbbell Chest Press':['Chest','Front delts','Triceps'],'MAG-Grip Lat Pulldown':['Lats','Biceps'],'Seated Cable Row':['Upper back','Rear delts','Biceps'],'Seated Dumbbell Shoulder Press':['Front delts','Side delts','Triceps'],'Cable Lateral Raise':['Side delts'],'Cable Lat Pullover':['Lats'],'Chest Fly':['Chest'],'Hip Abduction Machine':['Glutes'],'Single-Leg Seated Hamstring Curl':['Hamstrings'],'Hip Thrust':['Glutes'],'Romanian Deadlift':['Hamstrings','Glutes'],'Cable Kickback':['Glutes'],'Low-Incline Dumbbell Press':['Chest','Front delts','Triceps'],'Chest-Supported Row':['Upper back','Rear delts','Biceps'],'Lateral Raise':['Side delts'],'Reverse Pec Deck':['Rear delts'],'Biceps Curl':['Biceps'],'Triceps Pushdown':['Triceps'],'Barbell Back Squat':['Quads','Glutes','Adductors'],'Leg Press':['Quads','Glutes'],'Leg Extension':['Quads'],'Adductor Machine':['Adductors'],'Calf Raise':['Calves'],'Cable Crunch':['Abs'],'Hanging or Captain’s-Chair Knee Raise':['Abs'],'Pallof Press':['Abs'],'Reverse Crunch':['Abs'],'Weighted or Decline Crunch':['Abs'],'Stability-Ball Rollout':['Abs'],'Side Plank':['Abs'],'RKC Plank':['Abs']};
function musclePanel(){let counts={};for(const l of weekLogs())for(const [n,ss] of Object.entries(l.sets)){const m=muscles[n];if(!m)continue;let rows=Object.entries(ss).filter(([k,v])=>v.done);let sets=rows.filter(([k])=>! /^[LR]/.test(k)).length+Math.max(rows.filter(([k])=>k.startsWith('L')).length,rows.filter(([k])=>k.startsWith('R')).length);m.forEach((a,i)=>{let c=counts[a]??=[0,0];c[i===0?0:1]+=sets})}return `<article><h3>Muscle balance</h3><p class="muted">Week containing ${esc(date)} · completed mapped sets. Primary and secondary involvement are shown separately; these are estimates, not equivalent effective sets. Unilateral sets count the greater side count.</p>${[...new Set(Object.values(muscles).flat())].map(n=>{let c=counts[n]||[0,0];return `<p>${n} <strong style="float:right">${c[0]} primary · ${c[1]} secondary</strong></p><div class="bar"><i style="width:${Math.min(100,c[0]/20*100)}%"></i></div>`}).join('')}<small>New or renamed exercises are not mapped automatically.</small></article>`}
function imbalancePanel(logs){return `<article><h3>Imbalance tracking</h3><p class="muted">Compare best completed weighted sets on each side. Match reps, technique and equipment before interpreting differences.</p>${['Cable Kickback','Single-Leg Seated Hamstring Curl'].map(n=>`<h4>${n}</h4>${logs.filter(l=>l.sets[n]&&Object.values(l.sets[n]).some(v=>v.done)).slice(0,8).map(l=>{let sides=['L','R'].map(s=>{let a=Object.entries(l.sets[n]).filter(([k,v])=>k.startsWith(s)&&v.done&&Number(v.weight)>0&&Number(v.reps)>0).map(([k,v])=>v).sort((a,b)=>Number(b.weight)-Number(a.weight)||Number(b.reps)-Number(a.reps));return a.length?`${esc(a[0].weight)} lb × ${esc(a[0].reps)}`:'—'});return `<p>${esc(l.date)}<br>Left: ${sides[0]} · Right: ${sides[1]}</p>`}).join('')||'<p>No side-specific logs yet.</p>'}`).join('')}</article>`}
function timeline(){let n=Math.max(0,Math.floor((new Date(today+'T12:00')-new Date(state.started+'T12:00'))/86400000));let w=Math.floor(n/7)+1;return `<p class="tag">Program week ${w}</p><p>${n<42?`${42-n} days until corrective reassessment window`:n<56?'Corrective reassessment window open':'Corrective reassessment due if not completed'}. ${n<56?'Continue program through at least week 8.':n<84?'Review progress during weeks 8–12.':'Review program with your coach.'}</p>`}
let wellnessDate=today, editingCheckin=false;
function editCheckin(d){wellnessDate=d;editingCheckin=true;render();requestAnimationFrame(()=>{const el=$('well-editor');if(el)el.scrollIntoView({block:'start',behavior:'smooth'});});}
function cancelCheckin(){editingCheckin=false;wellnessDate=today;render();}
function wellnessPanel(){let data=state.wellness||{},v=data[wellnessDate]||{};return `<article class="metrics" id="well-editor"><h3>Recovery & measurements</h3>${editingCheckin?`<p class="tag" role="status">Editing check-in · ${esc(wellnessDate)}</p>`:''}<label>Date <input type="date" value="${wellnessDate}" ${editingCheckin?'disabled':''} onchange="wellnessDate=this.value;render()"></label>${[['sleep','Sleep (hours)',0,24],['energy','Energy (1–5)',1,5],['soreness','Soreness (1–5)',1,5],['fatigue','Fatigue (1–5)',1,5],['weight','Body weight (lb)',0,1500],['waist','Waist (in)',0,200],['hips','Hips (in)',0,200],['chest','Chest (in)',0,200],['thighL','Left thigh (in)',0,200],['thighR','Right thigh (in)',0,200]].map(([k,t,min,max])=>`<label>${t}<input id="well-${k}" type="number" min="${min}" max="${max}" step="any" value="${esc(v[k]??'')}"></label>`).join('')}<button class="primary" onclick="saveWellness()">${editingCheckin?'Save changes':'Save check-in'}</button>${editingCheckin?'<button onclick="cancelCheckin()">Cancel edit</button>':''}<p class="muted">1 = low, 5 = high. No automatic medical or readiness diagnosis.</p><details><summary>Check-in history</summary>${Object.entries(data).sort((a,b)=>b[0].localeCompare(a[0])).map(([d,x])=>`<p><strong>${esc(d)}</strong><br>${Object.entries(x).map(([k,val])=>`${esc(k)}: ${esc(val)}`).join(' · ')}<br><button onclick="editCheckin('${esc(d)}')">Edit</button> <button class="danger" onclick="deleteCheckin('${esc(d)}')">Delete</button></p>`).join('')||'<p>No check-ins yet.</p>'}</details></article>`}
function saveWellness(){if(!wellnessDate)return;let v={};for(const el of document.querySelectorAll('[id^="well-"]')){if(!el.value)continue;if(!el.checkValidity()){alert('Check your entry ranges.');return}v[el.id.slice(5)]=Number(el.value)}(state.wellness??={})[wellnessDate]=v;editingCheckin=false;save();render()}


function deleteCheckin(d){if(confirm('Delete this check-in only?')){delete state.wellness[d];if(wellnessDate===d)editingCheckin=false;save();render()}}
let measure='weight';const measurements={weight:'Body weight (lb)',waist:'Waist (in)',hips:'Hips (in)',chest:'Chest (in)',thighL:'Left thigh (in)',thighR:'Right thigh (in)'};
function measurementChart(){let a=Object.entries(state.wellness||{}).filter(([d,v])=>Number.isFinite(v[measure])).sort((a,b)=>a[0].localeCompare(b[0]));let vals=a.map(([d,v])=>v[measure]),lo=Math.min(...vals),hi=Math.max(...vals),span=hi-lo||1; if(a.length && hi===lo){let pad=Math.max(.5,Math.abs(hi)*.02);lo=Math.floor((lo-pad)*10)/10;hi=Math.ceil((hi+pad)*10)/10;span=hi-lo;}let pts=vals.map((v,i)=>[35+(vals.length===1?130:260*i/(vals.length-1)),125-(v-lo)/span*95]);return `<article><h3>Measurement trends</h3><select onchange="measure=this.value;render()">${Object.entries(measurements).map(([k,n])=>`<option value="${k}" ${k===measure?'selected':''}>${n}</option>`).join('')}</select>${a.length?`<svg class="chart" viewBox="0 0 330 150"><path d="M35 15V125H305" stroke="#798579" fill="none"/><text x="2" y="24" fill="#aab2aa" font-size="10">${hi}</text><text x="2" y="125" fill="#aab2aa" font-size="10">${lo}</text><polyline points="${pts.map(v=>v.join(',')).join(' ')}" fill="none" style="stroke:var(--accent)" stroke-width="3"/>${pts.map(v=>`<circle cx="${v[0]}" cy="${v[1]}" r="4" style="fill:var(--accent)"/>`).join('')}</svg>${a.map(([d,v])=>`<p>${esc(d)} · ${v[measure]}</p>`).join('')}`:'<p>No measurements yet.</p>'}</article>`}
let photoA='',photoB='';function photos(){return Array.isArray(state.photos)?state.photos:[]}
function photoPanel(){let a=photos();let opts=(sel)=>'<option value="">Select photo</option>'+a.map(x=>`<option value="${esc(x.id)}" ${sel===x.id?'selected':''}>${esc(x.date)} · ${esc(x.pose)}</option>`).join('');let show=id=>{let x=a.find(v=>v.id===id);return x&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(x.src)?`<div><img src="${x.src}" alt="Progress photo"><small>${esc(x.date)} · ${esc(x.pose)}</small></div>`:'<p>No photo selected</p>'};return `<article class="metrics"><h3>Private progress photos</h3><p>Stored on this device and in exported backups, not uploaded to GitHub. Backups are not encrypted. Keep them private. Up to 12 compressed photos; export regularly.</p><label>Date<input id="photoDate" type="date" value="${today}"></label><label>Pose<select id="photoPose"><option>Front</option><option>Side</option><option>Back</option></select></label><input type="file" accept="image/*" onchange="addPhoto(this.files[0])"><h4>Compare</h4><div class="photoPair"><select onchange="photoA=this.value;render()">${opts(photoA)}</select><select onchange="photoB=this.value;render()">${opts(photoB)}</select>${show(photoA)}${show(photoB)}</div><details><summary>Photo gallery (${a.length})</summary>${a.map(x=>`<div class="editrow">${show(x.id)}<button class="danger" onclick="deletePhoto('${esc(x.id)}')">Delete photo</button></div>`).join('')}</details></article>`}
async function addPhoto(f){if(!f)return;if(photos().length>=12){alert('Photo limit reached. Back up before removing older photos.');return}let d=$('photoDate').value,pose=$('photoPose').value;if(!d)return;let url=URL.createObjectURL(f);try{let im=new Image();im.src=url;await im.decode();let c=document.createElement('canvas'),scale=Math.min(1,800/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let src=c.toDataURL('image/jpeg',.65);if(src.length>350000)src=c.toDataURL('image/jpeg',.4);let x={id:String(Date.now()),date:d,pose,src};let old=state.photos;state.photos=[...photos(),x];try{localStorage.setItem('apex-v1',JSON.stringify(state))}catch(e){state.photos=old;alert('Not enough storage. Photo not saved.');return}photoA=x.id;render()}catch(e){alert('Could not open photo. Try a JPEG or PNG.')}finally{URL.revokeObjectURL(url)}}
function deletePhoto(id){if(confirm('Delete this photo?')){state.photos=photos().filter(x=>x.id!==id);save();render()}}
let editDay=0;function visualEditor(){let d=state.plan[editDay];return `<article class="metrics"><h3>Visual routine editor</h3><p>Export backup before edits. Renaming an exercise can separate its history and muscle mapping; existing logs are retained.</p><select onchange="editDay=Number(this.value);render()">${days.map((n,i)=>`<option value="${i}" ${i===editDay?'selected':''}>${n}</option>`).join('')}</select>${d.groups.map((g,j)=>`<h4>${esc(g[0])}</h4>${g[1].map((e,i)=>`<details class="editrow"><summary>${esc(e.n)} · ${e.s} × ${esc(e.r)}</summary>${[['n','Exercise'],['s','Sets'],['r','Rep / time range'],['rir','RIR'],['note','Notes']].map(([k,n])=>`<label>${n}<input id="ed-${j}-${i}-${k}" ${k==='s'?'type="number" min="1" max="20"':''} value="${esc(e[k])}"></label>`).join('')}<label>Side<select id="ed-${j}-${i}-side">${['','both','rightExtra','leftExtra'].map(v=>`<option value="${v}" ${v===e.side?'selected':''}>${v||'Bilateral'}</option>`).join('')}</select></label><label>Unit<select id="ed-${j}-${i}-unit">${['reps','sec','min','breaths'].map(v=>`<option ${v===e.unit?'selected':''}>${v}</option>`).join('')}</select></label><button onclick="saveExercise(${j},${i})">Save exercise</button><button onclick="moveExercise(${j},${i},-1)">↑</button><button onclick="moveExercise(${j},${i},1)">↓</button><button class="danger" onclick="removeExercise(${j},${i})">Remove</button></details>`).join('')}<button onclick="addExercise(${j})">+ Add exercise</button>`).join('')}</article>`}
function saveExercise(j,i){let e={};for(let k of ['n','s','r','rir','note','side','unit'])e[k]=$(`ed-${j}-${i}-${k}`).value;e.s=Number(e.s);let a=state.plan[editDay].groups[j][1];if(!e.n.trim()||!Number.isInteger(e.s)||e.s<1||e.s>20||!/^\d+(?:–\d+)?$/.test(e.r)||!(e.rir===''||/^\d+(?:–\d+)?$/.test(e.rir))){alert('Enter a name, 1–20 sets and numeric ranges using an en dash (8–12).');return}if(state.plan[editDay].groups.flatMap(g=>g[1]).some(x=>x!==a[i]&&x.n===e.n)){alert('Use a unique exercise name for this day.');return}a[i]=e;save();render()}
function moveExercise(j,i,delta){let a=state.plan[editDay].groups[j][1],k=i+delta;if(k<0||k>=a.length)return;[a[i],a[k]]=[a[k],a[i]];save();render()}
function removeExercise(j,i){if(confirm('Remove exercise from the plan? Historical logs remain.')){state.plan[editDay].groups[j][1].splice(i,1);save();render()}}

const appearanceDefault={texture:'Original',accent:'#b6fa38',darkness:35,opacity:100,custom:'',bg:'#101211',card:'#242824',ink:'#f5f5f5',button:'#b6fa38',border:'#444d44',zoom:100};
function appearance(){let a=state.appearance||{};return {texture:['Original','Midnight black',...Object.keys(textureTiles),'Custom photo'].includes(a.texture)?a.texture:'Original',accent:/^#[0-9a-f]{6}$/i.test(a.accent||'')?a.accent:appearanceDefault.accent,darkness:Number.isFinite(a.darkness)?Math.max(20,Math.min(90,a.darkness)):35,opacity:Number.isFinite(a.opacity)?Math.max(80,Math.min(100,a.opacity)):100,...Object.fromEntries(['bg','card','ink','button','border'].map(k=>[k,/^#[0-9a-f]{6}$/i.test(a[k]||'')?a[k]:appearanceDefault[k]])),zoom:Number.isFinite(a.zoom)?Math.max(75,Math.min(250,a.zoom)):100,custom:typeof a.custom==='string'&&a.custom.length<450000&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(a.custom)?a.custom:''}}
function applyAppearance(){let a=appearance(),r=document.documentElement.style;let rgb=a.accent.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);let lum=.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];r.setProperty('--accent',a.accent);r.setProperty('--accent-ink',lum>.179?'#000':'#fff');r.setProperty('--apex-bg',a.texture==='Midnight black'?'#050505':a.bg);r.setProperty('--apex-ink',a.ink);r.setProperty('--apex-button',a.button);r.setProperty('--apex-border',a.border);let bl=a.button.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);r.setProperty('--accent-ink',.2126*bl[0]+.7152*bl[1]+.0722*bl[2]>.179?'#000':'#fff');let src=a.texture==='Custom photo'?a.custom:textureTiles[a.texture];r.setProperty('--apex-pattern',src?'url("'+src+'")':'none');r.setProperty('--apex-overlay',src?'rgba(0,0,0,'+a.darkness/100+')':'transparent');r.setProperty('--apex-size',a.texture==='Custom photo'?'cover':Math.round(260*a.zoom/100)+'px auto');r.setProperty('--apex-card','rgba('+a.card.slice(1).match(/../g).map(x=>parseInt(x,16)).join(',')+','+a.opacity/100+')');}
function changeAppearance(k,v){let old=state.appearance;state.appearance={...appearance(),[k]:v};if(k==='accent')state.appearance.button=v;try{localStorage.setItem('apex-v1',JSON.stringify(state));applyAppearance();$('toast').textContent='Appearance saved on this device.';if(k==='texture')render()}catch(e){state.appearance=old;applyAppearance();alert('Storage full. Appearance not saved.');render()}}
function resetAppearance(){changeAppearance('texture','Original');let old=state.appearance;state.appearance={...appearanceDefault};try{localStorage.setItem('apex-v1',JSON.stringify(state));}catch(e){state.appearance=old;alert('Could not save defaults.')}applyAppearance();render()}
function saveTheme(){let name=prompt("Name this theme");if(!name||!name.trim())return;let old=state.themes;state.themes=[...(Array.isArray(old)?old:[]),{name:name.trim().slice(0,50),appearance:appearance()}].slice(-10);try{localStorage.setItem("apex-v1",JSON.stringify(state));render()}catch(e){state.themes=old;alert("Not enough storage to save theme.")}}
function loadTheme(i){let old=state.appearance;state.appearance=state.themes[i].appearance;try{localStorage.setItem("apex-v1",JSON.stringify(state));render()}catch(e){state.appearance=old;alert("Could not save theme.")}}
function deleteTheme(i){if(!confirm("Remove saved theme?"))return;let old=state.themes;state.themes=old.filter((_,j)=>j!==i);try{localStorage.setItem("apex-v1",JSON.stringify(state));render()}catch(e){state.themes=old;alert("Could not remove theme.")}}
function appearancePanel(){let a=appearance();return `<article class="appearance"><h3>Appearance</h3><p class="muted">Personalize APEX. Changes preview immediately and save on this device.</p><p class="muted">Signature Collection · 20 realistic AI-created textures</p>${[['Animal prints',Object.keys(textureTiles).slice(0,18)],['Luxury materials',Object.keys(textureTiles).slice(18)]].map(([title,items])=>`<details><summary>${title}</summary><div class="texture-grid">${items.map(n=>`<button type="button" class="texture-choice ${a.texture===n?'chosen':''}" onclick="changeAppearance('texture',${esc(JSON.stringify(n))})"><img src="${textureTiles[n]}" alt=""><span>${esc(n)}</span></button>`).join('')}</div></details>`).join('')}<label>Background texture<select onchange="changeAppearance('texture',this.value)">${['Original','Midnight black',...Object.keys(textureTiles),'Custom photo'].map(n=>`<option ${n===a.texture?'selected':''}>${n}</option>`).join('')}</select></label><label>Upload background photo<input type="file" accept="image/*" onchange="uploadBackground(this.files[0])"></label><label>Accent color<input type="color" value="${a.accent}" onchange="changeAppearance('accent',this.value)"></label>${[['Button color','button'],['Background color','bg'],['Card color','card'],['Text color','ink'],['Border color','border']].map(([label,k])=>`<label>${label}<input type="color" value="${a[k]}" onchange="changeAppearance('${k}',this.value)"></label>`).join('')}<label>Texture zoom <output>${a.zoom}%</output><input type="range" min="75" max="250" value="${a.zoom}" oninput="this.previousElementSibling.value=this.value+'%';document.documentElement.style.setProperty('--apex-size',Math.round(260*this.value/100)+'px auto')" onchange="changeAppearance('zoom',Number(this.value))"></label><label>Background darkness <output>${a.darkness}%</output><input type="range" min="20" max="90" value="${a.darkness}" oninput="this.previousElementSibling.value=this.value+'%';document.documentElement.style.setProperty('--apex-overlay','rgba(0,0,0,'+this.value/100+')')" onchange="changeAppearance('darkness',Number(this.value))"></label><label>Card opacity <output>${a.opacity}%</output><input type="range" min="80" max="100" value="${a.opacity}" oninput="this.previousElementSibling.value=this.value+'%';document.documentElement.style.setProperty('--apex-card','rgba('+appearance().card.slice(1).match(/../g).map(x=>parseInt(x,16)).join(',')+','+this.value/100+')')" onchange="changeAppearance('opacity',Number(this.value))"></label><div class="theme-preview"><div class="big">APEX</div><p>Live appearance preview</p><button class="primary" type="button">Sample button</button></div><p class="muted">Textures are realistic AI-created images, bundled in the app. Choose readable text and accent colors. Custom images are compressed and included in unencrypted backups. Choose a bright accent for readable labels.</p><h3>Saved themes</h3><button onclick="saveTheme()">Save current theme</button>${(Array.isArray(state.themes)?state.themes:[]).map((t,i)=>`<div class="line"><button onclick="loadTheme(${i})">${esc(t.name)}</button><button class="danger" onclick="deleteTheme(${i})">Remove</button></div>`).join('')}<p class="muted">Up to 10 favorites. Custom image storage is limited by your device.</p><button onclick="resetAppearance()">Restore original appearance</button></article>`}
async function uploadBackground(f){if(!f)return;let u=URL.createObjectURL(f);try{let im=new Image();im.src=u;await im.decode();let c=document.createElement('canvas'),sc=Math.min(1,900/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let src=c.toDataURL('image/jpeg',.65);if(src.length>440000)src=c.toDataURL('image/jpeg',.35);if(src.length>440000)throw Error();let old=state.appearance;state.appearance={...appearance(),texture:'Custom photo',custom:src};try{localStorage.setItem('apex-v1',JSON.stringify(state))}catch(e){state.appearance=old;throw e}applyAppearance();render()}catch(e){alert('Could not save background. Try a smaller JPEG or PNG.')}finally{URL.revokeObjectURL(u)}}

render();
