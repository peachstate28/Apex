const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=iso(new Date());let date=today, day=(new Date().getDay()+6)%7, tab='Home';let state={logs:{},plan:base,extra:true,started:today};try{const x=JSON.parse(localStorage.getItem('apex-v1'));if(x&&x.logs&&x.plan)state=x}catch(e){}function save(){try{localStorage.setItem('apex-v1',JSON.stringify(state));$('toast').textContent='Saved on this device.'}catch(e){$('toast').textContent='Storage unavailable. Export a backup before closing.'}}function key(){return date+'|'+day}function log(){return state.logs[key()]??={date,day,sets:{},form:{},notes:'',complete:false}}function entries(e){let a=[];if(e.side){let sides=e.side==='rightExtra'?['R','L']:['L','R'];for(let i=1;i<=e.s;i++)for(const s of sides)a.push(`${s}${i}`);if(state.extra&&e.side.endsWith('Extra'))a.push((e.side==='rightExtra'?'R':'L')+(e.s+1))}else for(let i=1;i<=e.s;i++)a.push(String(i));return a}function prev(n,s){let logs=Object.values(state.logs).filter(l=>l.date<date).sort((a,b)=>b.date.localeCompare(a.date));for(const l of logs){let v=l.sets[n]?.[s];if(v?.done)return v}return {}}function setVal(n,s,k,v){let l=log();let a=l.sets[n]??={};let b=a[s]??={};b[k]=v;if(k==='done'&&!v)l.complete=false;save();if(k==='done')render()}function setForm(n,v){log().form[n]=v;save();render()}const checks=['Full intended depth','Minimal hip shift','Solid brace','Even foot pressure','Hips and chest rise together'];function card(e){let l=log(),rows=entries(e),sets=l.sets[e.n]||{},top=Number(e.r.split('–').pop()),isSquat=e.n==='Barbell Back Squat',strength=e.unit==='reps'&&e.rir;let optional=e.note.includes('optional');let required=rows.filter((r,i)=>!optional||i<rows.length-1);let ready=strength&&required.every(s=>{let v=sets[s];return v?.done&&Number(v.reps)>=top&&v.clean&&v.rir!==undefined&&v.rir!==''&&Number(v.rir)>=Number(e.rir.split('–')[0])&&Number(v.rir)<=Number(e.rir.split('–').pop())})&&(!isSquat||checks.every(c=>l.form[c]));let en=JSON.stringify(e.n).replace(/'/g,'&#39;');return `<article><h3>${esc(e.n)}</h3><div class="tag">${e.s} ${e.side?'SETS / SIDE':'SETS'} · ${esc(e.r)} ${e.unit}${e.rir?' · '+e.rir+' RIR':''}</div>${e.note?`<p class="muted">${esc(e.note)}</p>`:''}<div class="line muted"><span>Set</span>${e.unit==='reps'?'<span style="flex:1;text-align:center">lbs</span>':''}<span style="flex:1;text-align:center">${e.unit}</span>${strength?'<span style="flex:1;text-align:center">RIR</span>':''}<span>Done</span></div>${rows.map(s=>{let v=sets[s]||{},p=prev(e.n,s);return `<div class="line"><span>${s}</span>${e.unit==='reps'?`<input aria-label="Set ${s} weight" type="number" min="0" step="any" inputmode="decimal" placeholder="${esc(p.weight??'lbs')}" value="${esc(v.weight??'')}" onchange='setVal(${en},"${s}","weight",this.value)'>`:''}<input aria-label="Set ${s} ${e.unit}" type="number" min="0" step="any" inputmode="decimal" placeholder="${esc(p.reps??e.r)}" value="${esc(v.reps??'')}" onchange='setVal(${en},"${s}","reps",this.value)'>${strength?`<input aria-label="Set ${s} RIR" type="number" min="0" step="1" placeholder="RIR" value="${esc(v.rir??'')}" onchange='setVal(${en},"${s}","rir",this.value)'>`:''}<input type="checkbox" aria-label="Complete set ${s}" ${v.done?'checked':''} onchange='setVal(${en},"${s}","done",this.checked)'></div>${p.done?`<div class="prev">Previous ${s}: ${esc(p.weight||'')}${p.weight?' lb × ':''}${esc(p.reps)} ${e.unit}${p.rir!==undefined&&p.rir!==''?` · ${esc(p.rir)} RIR`: ''}</div>`:''}${strength?`<label class="check muted"><input type="checkbox" ${v.clean?'checked':''} onchange='setVal(${en},"${s}","clean",this.checked);render()'>Clean form</label>`:''}`}).join('')}${isSquat?`<h4>Squat form gate</h4>${checks.map(c=>`<label class="check"><input type="checkbox" ${l.form[c]?'checked':''} onchange='setForm(${JSON.stringify(c)},this.checked)'>${c}</label>`).join('')}`:''}${ready?'<p class="tag">✓ Rep, RIR and form targets met. Consider a small weight increase next session.</p>':''}</article>`}function changeDate(v){if(!v)return;date=v;day=(new Date(v+'T12:00').getDay()+6)%7;render()}function changeDay(i){let d=new Date(date+'T12:00');d.setDate(d.getDate()-((d.getDay()+6)%7)+i);date=iso(d);day=i;render()}function go(t){tab=t;render();window.scrollTo(0,0)}function weekLogs(){let d=new Date(date+'T12:00');d.setDate(d.getDate()-((d.getDay()+6)%7));let start=iso(d);d.setDate(d.getDate()+6);let end=iso(d);return Object.values(state.logs).filter(l=>l.date>=start&&l.date<=end)}function finish(){let l=log();l.complete=true;save();go('Home')}function render(){let p=state.plan[day], l=log(), w=weekLogs(), complete=w.filter(x=>x.complete).length;let cardio=0;for(let x of w)for(let g of state.plan[x.day].groups)for(let e of g[1])if(e.unit==='min')for(let v of Object.values(x.sets[e.n]||{}))if(v.done)cardio+=Number(v.reps)||0;let all=p.groups.flatMap(g=>g[1]);let total=all.reduce((a,e)=>a+entries(e).length,0),done=all.reduce((a,e)=>a+entries(e).filter(s=>l.sets[e.n]?.[s]?.done).length,0);$('nav').innerHTML=['Home','Train','Plan','Progress','Settings'].map(t=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('');let picker=`<label class="muted">Workout date <input type="date" value="${date}" onchange="changeDate(this.value)"></label><div class="days">${days.map((d,i)=>`<button class="${i===day?'active':''}" onclick="changeDay(${i})">${d.slice(0,3)}</button>`).join('')}</div>`;if(tab==='Home')$('app').innerHTML=`<h2>Performance dashboard</h2><div class="stats"><article><div class="big">${complete}/7</div><small>Sessions completed this week</small></article><article><div class="big">${cardio} min</div><small>Cardio this week</small></article></div>${picker}<article><div class="tag">${days[day].toUpperCase()}</div><h2>${esc(p.title)}</h2><div class="bar"><i style="width:${total?done/total*100:0}%"></i></div><p>${done}/${total} logged sets or activities</p><button class="primary" onclick="go('Train')">${done?'CONTINUE SESSION':'START SESSION'}</button></article><article><h3>Corrective focus</h3><p>Left glute • Right hamstring. Reassess at 6–8 weeks. Run the program 8–12 weeks.</p><small>Program start: ${esc(state.started)}</small></article>`;if(tab==='Train')$('app').innerHTML=`${picker}<h2>${esc(p.title)}</h2><p>${esc(p.note||'')}</p><div class="bar"><i style="width:${total?done/total*100:0}%"></i></div><p>${done}/${total} sets or activities checked</p><article><h3>Rest timer</h3><div class="line"><button onclick="timerStart(60)">60s</button><button onclick="timerStart(90)">90s</button><button onclick="timerStart(120)">120s</button><button onclick="timerStart(180)">180s</button><button onclick="timerStart(0)">Stop</button></div><div id="timer" class="big">${timerText()}</div></article>${p.groups.map(g=>`<h2>${esc(g[0])}</h2>${g[1].map(card).join('')}`).join('')}<article><h3>Session notes</h3><textarea placeholder="Form, soreness, energy, etc." onchange="log().notes=this.value;save()">${esc(l.notes)}</textarea></article><button class="primary" onclick="finish()">MARK SESSION COMPLETE</button>`;if(tab==='Plan')$('app').innerHTML=`<h2>Weekly program</h2>${state.plan.map((p,i)=>`<article><div class="tag">${days[i]}</div><h3>${esc(p.title)}</h3><p>${p.groups.map(g=>esc(g[0])).join(' • ')}</p><button onclick="changeDay(${i});go('Train')">Open session</button></article>`).join('')}<article><h3>Progression rules</h3><p>Build reps first. Increase weight only when all required sets reach the top of the range with clean form and target RIR. Squats additionally require all five form checks.</p><h3>Shoulder balance</h3><p>Front delts: chest and shoulder presses. Side delts: Monday 2 + Thursday 3 direct sets. Rear delts: rows + Thursday 3 direct sets. No front raises or upright rows.</p></article>`;if(tab==='Progress'){let logs=Object.values(state.logs).filter(x=>Object.values(x.sets).some(s=>Object.values(s).some(v=>v.done))||x.complete).sort((a,b)=>b.date.localeCompare(a.date));let best={};for(let x of logs)for(let [n,ss] of Object.entries(x.sets))for(let v of Object.values(ss))if(v.done&&Number(v.weight)>0&&Number(v.reps)>0){let b=best[n];if(!b||Number(v.weight)>b.w||(Number(v.weight)===b.w&&Number(v.reps)>b.r))best[n]={w:Number(v.weight),r:Number(v.reps),date:x.date}}$('app').innerHTML=`<h2>Progress</h2><article><h3>Best logged loads</h3>${Object.entries(best).map(([n,b])=>`<p><strong>${esc(n)}</strong><br>${b.w} lb × ${b.r} reps · ${b.date}</p>`).join('')||'<p>No completed weighted sets yet.</p>'}</article>${analytics(logs)}<h2>Session history</h2>${logs.map(x=>`<article><h3>${esc(x.date)} · ${days[x.day]}</h3><small>${x.complete?'Completed':'In progress'}</small><details><summary>View logged sets</summary>${Object.entries(x.sets).map(([n,ss])=>`<p><strong>${esc(n)}</strong><br>${Object.entries(ss).filter(([s,v])=>v.done).map(([s,v])=>`${esc(s)}: ${esc(v.weight||'')}${v.weight?' lb × ':''}${esc(v.reps||'—')}`).join(' · ')}</p>`).join('')}<p>${esc(x.notes)}</p></details><button onclick="date='${x.date}';day=${x.day};go('Train')">Open log</button> <button class="danger" onclick="deleteSession('${x.date}',${x.day})">Delete log</button></article>`).join('')||'<p>Your workout history will appear here.</p>'}`};if(tab==='Settings')$('app').innerHTML=`<h2>Settings</h2><article><label>Program start <input type="date" value="${esc(state.started)}" onchange="state.started=this.value;save()"></label><label class="check"><input type="checkbox" ${state.extra?'checked':''} onchange="state.extra=this.checked;save()">Extra left-glute and right-hamstring sets</label><p>Reassess at 6–8 weeks before removing corrective volume.</p></article><article><h3>Backup & restore</h3><p>Data is stored in this browser, not in an account. Export regularly.</p><button onclick="backup()">Export backup</button><label>Restore backup <input type="file" accept="application/json,.json" onchange="restore(this.files[0])"></label></article><article><h3>Edit program</h3><p>Advanced editor: exercise name, sets, range, RIR, notes, side and unit. Export a backup first.</p><textarea id="editor" rows="12">${esc(JSON.stringify(state.plan,null,2))}</textarea><button onclick="editPlan()">Save program edits</button></article>`}
let timerEnd=0;function timerText(){let s=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}function timerStart(s){timerEnd=s?Date.now()+s*1000:0;if($('timer'))$('timer').textContent=timerText()}setInterval(()=>{if($('timer'))$('timer').textContent=timerText()},250);function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='APEX-backup-'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function validPlan(p){return Array.isArray(p)&&p.length===7&&p.every(d=>typeof d.title==='string'&&Array.isArray(d.groups)&&d.groups.every(g=>Array.isArray(g)&&typeof g[0]==='string'&&Array.isArray(g[1])&&g[1].every(e=>typeof e.n==='string'&&Number.isInteger(e.s)&&e.s>0&&e.s<=20&&typeof e.r==='string'&&typeof e.rir==='string'&&typeof e.note==='string'&&['','both','rightExtra','leftExtra'].includes(e.side)&&['reps','sec','min','breaths'].includes(e.unit))))}async function restore(f){if(!f)return;try{let x=JSON.parse(await f.text());if(!validPlan(x.plan)||!x.logs||typeof x.logs!=='object'||typeof x.extra!=='boolean')throw Error();if(confirm('Replace current data with this backup?')){state=x;save();render()}}catch(e){alert('Invalid backup file.')}}function editPlan(){try{let p=JSON.parse($('editor').value);if(!validPlan(p))throw Error();state.plan=p;save();render()}catch(e){alert('Invalid program format. No changes saved.')}}
function deleteSession(d,i){if(!confirm('Delete only the workout log for '+d+'? Your program and settings will remain unchanged.'))return;delete state.logs[d+'|'+i];save();render()}
let selectedExercise='';
function analytics(logs){const data=new Map();for(const l of logs)for(const [n,ss] of Object.entries(l.sets))for(const v of Object.values(ss)){if(!v.done||!(Number(v.weight)>0)||!(Number(v.reps)>0))continue;if(!data.has(n))data.set(n,new Map());const dates=data.get(n);const a=dates.get(l.date)||{w:0,volume:0};a.w=Math.max(a.w,Number(v.weight));a.volume+=Number(v.weight)*Number(v.reps);dates.set(l.date,a)}const names=[...data.keys()].sort();if(!names.length)return '<article><h3>Strength analytics</h3><p>Log weighted sets to see trends.</p></article>';if(!data.has(selectedExercise))selectedExercise=names[0];const pts=[...data.get(selectedExercise)].sort((a,b)=>a[0].localeCompare(b[0]));const max=Math.max(...pts.map(p=>p[1].w),1);const coords=pts.map((p,i)=>[30+(pts.length===1?135:i*270/(pts.length-1)),135-p[1].w/max*105]);return `<article><h3>Strength analytics</h3><label>Exercise <select style="max-width:100%" onchange="selectedExercise=this.value;render()">${names.map(n=>`<option ${n===selectedExercise?'selected':''}>${esc(n)}</option>`).join('')}</select></label><p>Heaviest completed set per day (lb)</p><svg class="chart" viewBox="0 0 330 160" role="img" aria-label="Weight trend"><path d="M30 15V135H310" fill="none" stroke="#798579"/><text x="2" y="25" fill="#aab2aa" font-size="11">${max}</text><text x="12" y="135" fill="#aab2aa" font-size="11">0</text><polyline points="${coords.map(c=>c.join(',')).join(' ')}" fill="none" stroke="#b6fa38" stroke-width="3"/>${coords.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="4" fill="#b6fa38"/>`).join('')}</svg>${pts.map(([d,a])=>`<p class="muted">${d} · ${a.w} lb best · ${a.volume.toLocaleString()} lb-reps logged</p>`).join('')}<small>Volume uses entered loads, not estimated total dumbbell load.</small></article>`}

render();
